name: Test

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ${{ github.repository == 'luvxinc/Sweetmeter' && github.actor == 'luvxinc' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/')) && fromJSON('["self-hosted","Linux","ARM64","sweetmeter-ci"]') || fromJSON('["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Tk runtime
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - run: python -m meter --version
      - run: python -m meter --self-test
      - name: Portable C++ state tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for source in tests/test_*.cpp; do
            c++ -std=c++17 -Wall -Wextra -Werror -Itests "$source" -o /tmp/sweetmeter-cpp-test
            /tmp/sweetmeter-cpp-test
          done
  firmware:
    runs-on: ${{ github.repository == 'luvxinc/Sweetmeter' && github.actor == 'luvxinc' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/')) && fromJSON('["self-hosted","Linux","ARM64","sweetmeter-ci"]') || fromJSON('["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: pio run -d firmware
      - run: python scripts/firmware_artifact.py create --output dist/firmware-build.zip
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist/firmware-build.zip
          if-no-files-found: error
          retention-days: 90
  native:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            id: linux-x86_64
          - runner: windows-2025
            id: windows-x86_64
          - runner: macos-15
            id: macos-arm64
          - runner: macos-15-intel
            id: macos-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux Tk runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_companion.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.id }}
          path: dist/Sweetmeter-*.zip*
          if-no-files-found: error
  test:
    name: test
    if: always()
    needs: [unit, firmware, native]
    runs-on: ${{ github.repository == 'luvxinc/Sweetmeter' && github.actor == 'luvxinc' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/')) && fromJSON('["self-hosted","Linux","ARM64","sweetmeter-ci"]') || fromJSON('["ubuntu-22.04"]') }}
    steps:
      - name: Require every source and build check
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          FIRMWARE_RESULT: ${{ needs.firmware.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$UNIT_RESULT" = success && test "$FIRMWARE_RESULT" = success && test "$NATIVE_RESULT" = success
